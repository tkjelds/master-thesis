readme = "README.md"
authors = [
    { name = "tkjelds", email = "tkjelds385@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "matplotlib>=3.11.2",
    "openai>=3.41.0",
    "pandas>=3.1.0",
